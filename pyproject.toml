[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonscope"
version = "0.2.0"
description = "A debugger for the memory of BDH (Dragon Hatchling) models: capture, map, forget and audit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["torch>=2.5", "numpy>=2.0"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13.0"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[project.scripts]
dragonscope-dashboard = "dragonscope.dashboard:main"

[tool.setuptools.packages.find]
include = ["dragonscope*"]

[tool.setuptools.package-data]
dragonscope = ["static/*", "static/vendor/*"]
"dragonscope.vendor.bdh" = ["LICENSE.md"]
